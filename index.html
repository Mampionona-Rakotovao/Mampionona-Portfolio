<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Razafindraimindra Mampionona Rakotovao — Étudiant en Licence 3 Informatique, développeur web & mobile."
    />
    <title>Mampionona Rakotovao — Développeur Web & Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply dark mode before paint to avoid flash.
      // Default is dark; system preference is never consulted.
      const storedTheme = localStorage.getItem('portfolio-theme')
      if (storedTheme !== 'light') {
        document.documentElement.classList.add('dark')
      }
      // Apply stored language before paint; default to French, fall back to
      // browser detection only on the very first visit.
      const storedLang = localStorage.getItem('portfolio-lang')
      const lang = storedLang === 'en' ? 'en' : storedLang === 'fr' ? 'fr' : navigator.language.slice(0, 2) === 'en' ? 'en' : 'fr'
      document.documentElement.lang = lang
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
